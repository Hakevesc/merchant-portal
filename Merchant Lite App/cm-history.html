<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sweep History</title>
<link rel="stylesheet" href="cm.css">
<style>
  .filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:2px -16px 4px;padding:0 16px 2px}
  .filters::-webkit-scrollbar{display:none}
  .filters button{
    flex-shrink:0;height:34px;padding:0 15px;border-radius:17px;border:none;cursor:pointer;
    background:var(--field);font-size:12px;font-weight:600;color:var(--ink-2);
  }
  .filters button.on{background:var(--red);color:#fff;font-weight:700}
  .group{font-size:11px;font-weight:700;color:var(--faint);letter-spacing:.5px;margin:14px 2px 8px}
  /* Search above the status tabs, in the same soft-field style. */
  .search{margin-bottom:12px;display:flex;align-items:center;gap:12px;height:50px;padding:0 20px;border-radius:25px;background:var(--field)}
  .search svg{width:18px;height:18px;flex-shrink:0;stroke:var(--faint);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .search input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-family:inherit;font-size:14px;color:var(--ink);caret-color:var(--green)}
  .search input::placeholder{color:var(--faint)}
  /* Title on the left, date range pill on the right (as on My Draw Codes). */
  .title-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
  .title-row h1{margin-top:0}
  .range-pill{
    display:flex;align-items:center;gap:7px;height:32px;padding:0 10px 0 12px;border-radius:16px;border:none;cursor:pointer;
    background:var(--field);font-family:inherit;font-size:11.5px;font-weight:700;color:var(--ink-2);letter-spacing:.4px;text-transform:uppercase;
    text-decoration:none;white-space:nowrap;
  }
  .range-pill svg{width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .range-pill .chev{width:13px;height:13px}
  .range-pill.on{background:var(--green-l);color:var(--green-d)}
  .range-pill.on svg{stroke:var(--green-d)}
  .empty-list{text-align:center;padding:28px 10px;color:var(--muted);font-size:12.5px}
</style>
</head>
<body>
<div class="phone-scroll">
  <div class="top">
    <button class="icon-btn" onclick="CM.goBack('cm-home.html')" aria-label="Back" id="backBtn"></button>
    <div class="title-row"><h1>Sweep History</h1>
      <a class="range-pill" id="rangePill" href="cm-history-dates.html" onclick="location.replace(this.href);return false"></a></div>
  </div>
  <div class="page-simple" style="padding-bottom:40px">
    <label class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
      <input id="q" type="search" placeholder="Search date, amount or reference" autocomplete="off">
    </label>
    <div class="filters" id="filters"></div>
    <div id="list"></div>
  </div>
</div>
<div class="gesture-bar"></div>

<script src="cm.js"></script>
<script>
(function () {
  var I = CM.ICON, S = CM.state;
  document.getElementById('backBtn').innerHTML = I.back;

  /* PRD Screen 6: one row per sweep — date, amounts and overall status —
     with status tabs to narrow the list. */
  var FILTERS = [['all', 'All'], ['successful', 'Successful'], ['partial', 'Partial'], ['failed', 'Failed'], ['cancelled', 'Cancelled']];
  var active = 'all';
  document.getElementById('filters').innerHTML = FILTERS.map(function (f) {
    return '<button data-f="' + f[0] + '">' + f[1] + '</button>';
  }).join('');
  document.querySelectorAll('[data-f]').forEach(function (b) { b.onclick = function () { active = b.dataset.f; render(); }; });

  var range = CM.histRange();
  function iso(label) { return CM.isoDate(label); }
  function short(d) { var p = d.split('-'); return +p[2] + ' ' + CM.MONTHS[+p[1] - 1]; }
  function monthOf(label) { var p = label.split(' '); return (FULL[CM.MONTHS.indexOf(p[1])] + ' ' + p[2]).toUpperCase(); }
  var FULL = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

  /* Range pill: "All time", or the chosen dates, e.g. "21 Oct – 26 Oct".
     The date screen replaces this page so Back never stacks two histories. */
  var DOWN = '<svg class="chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>';
  var pill = document.getElementById('rangePill');
  pill.classList.toggle('on', !!range);
  pill.innerHTML = I.cal + (range ? short(range.from) + (range.to !== range.from ? ' – ' + short(range.to) : '') : 'All time') + DOWN;

  function render() {
    document.querySelectorAll('[data-f]').forEach(function (b) { b.classList.toggle('on', b.dataset.f === active); });
    var q = document.getElementById('q').value.trim().toLowerCase().replace(/,/g, '');
    var rows = S.history.filter(function (b) {
      if (active !== 'all' && b.status !== active) return false;
      if (range && (iso(b.date) < range.from || iso(b.date) > range.to)) return false;
      if (!q) return true;
      /* Match what the row shows (date, time, amount, status) plus the reference. */
      var text = (b.ref + ' ' + CM.sweepRow(b).replace(/<[^>]+>/g, ' ')).toLowerCase().replace(/,/g, '');
      return text.indexOf(q) !== -1;
    });
    var head = rows.length ? '<div class="group">' + monthOf(rows[0].date) + '</div>' : '<div style="height:14px"></div>';
    document.getElementById('list').innerHTML = head + (rows.length
      ? '<div class="hist">' + rows.map(function (b) {
          return '<a class="tile" href="cm-sweep.html?ref=' + b.ref + '">' + CM.sweepRow(b) + '</a>';
        }).join('') + '</div>'
      : '<div class="hist">' + (!S.history.length ? CM.emptySweeps()
          : q ? CM.emptySweeps('No results', 'No sweeps match your search.')
          : range ? CM.emptySweeps('No sweeps in this period', 'Try a different date range.')
          : CM.emptySweeps('No sweeps here', 'There are no sweeps with this status.')) + '</div>');
  }
  document.getElementById('q').addEventListener('input', render);
  render();
})();
</script>
</body>
</html>
