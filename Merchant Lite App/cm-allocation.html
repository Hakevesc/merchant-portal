<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Allocation</title>
<link rel="stylesheet" href="cm.css">
<style>
  .acct{padding:12px 14px;border-radius:14px;background:var(--field);border:1.5px solid transparent}
  .acct + .acct{margin-top:10px}
  .acct-head{display:flex;align-items:center;gap:10px}
  .acct .field{margin-top:10px;background:#fff}
  .acct.primary{background:#fff;border-color:var(--green)}
  .acct.primary .remainder{
    margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--green-l);
    font-size:12px;font-weight:600;color:var(--green-d);
  }
  .meter-row{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;margin-top:12px}
  .meter-row b{font-weight:800}
  .meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}
  .meter i{display:block;height:100%;border-radius:4px;background:var(--green);transition:width .2s}
  .meter.over i{background:var(--red)}
  .preview .alloc-line .amt.short{color:#b45309}
  .preview .total{display:flex;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:1px dashed var(--field-line);font-size:12px}
  .preview .total b{font-weight:800}
  .problems{margin-top:14px}
  .problems .notice + .notice{margin-top:8px}
</style>
</head>
<body>
<div class="phone-scroll">
  <div class="header">
    <button class="icon-btn" onclick="location.href='cm-home.html'" aria-label="Close" id="closeBtn"></button>
    <div class="header-title">ALLOCATION</div>
    <div class="step-dots"><i class="on"></i><i></i><i></i></div>
  </div>

  <div class="page">
    <div class="section-label">Choose how to allocate</div>
    <button class="opt" data-type="fixed">
      <span class="opt-ico" data-ico="lock"></span>
      <span><span class="opt-title" style="display:block">Fixed Amount</span>
      <span class="opt-sub" style="display:block">Send a set amount to each bank account</span></span>
      <span class="radio"></span>
    </button>
    <button class="opt" data-type="percent">
      <span class="opt-ico" data-ico="percent"></span>
      <span><span class="opt-title" style="display:block">Percentage Allocation</span>
      <span class="opt-sub" style="display:block">Split your eligible balance by percentage</span></span>
      <span class="radio"></span>
    </button>

    <div class="section-label">Primary / Remainder account</div>
    <div class="hint" style="margin:-4px 0 10px">Receives whatever is left after the other allocations, so no balance is left behind.</div>
    <div id="primaryList"></div>

    <div class="section-label" id="amountsLabel">Amount per account</div>
    <div id="acctList"></div>
    <div id="meterWrap"></div>

    <div class="section-label">If the sweep ran now</div>
    <div class="card card-pad preview" id="preview"></div>

    <div class="problems" id="problems"></div>
    <div id="inactiveNote" style="margin-top:14px"></div>
  </div>
</div>

<div class="footer">
  <button class="btn btn-primary" id="continueBtn">Continue</button>
</div>
<div class="gesture-bar"></div>

<script src="cm.js"></script>
<script>
(function () {
  var I = CM.ICON;
  if (/[?&]edit=1/.test(location.search)) { CM.startDraft(); history.replaceState(null, '', 'cm-allocation.html'); }
  var d = CM.getDraft();
  var banks = CM.activeBanks();
  document.getElementById('closeBtn').innerHTML = I.close;
  document.querySelectorAll('[data-ico]').forEach(function (el) { el.innerHTML = I[el.dataset.ico]; });

  /* Never leave the remainder unassigned if there is an obvious default. */
  if (!d.primary && banks.length) d.primary = banks[banks.length - 1].id;

  function render() {
    document.querySelectorAll('.opt[data-type]').forEach(function (o) {
      o.classList.toggle('on', o.dataset.type === d.type);
    });

    document.getElementById('primaryList').innerHTML = banks.map(function (b) {
      return '<button class="opt' + (d.primary === b.id ? ' on' : '') + '" data-primary="' + b.id + '">' +
        CM.bankAv(b) +
        '<span><span class="opt-title" style="display:block;font-size:13.5px">' + CM.esc(b.bank) + '</span>' +
        '<span class="opt-sub" style="display:block">' + CM.mask(b.acct) + '</span></span>' +
        '<span class="radio"></span></button>';
    }).join('');

    var unit = d.type === 'fixed' ? 'ETB' : '%';
    document.getElementById('amountsLabel').textContent = d.type === 'fixed' ? 'Amount per account' : 'Percentage per account';
    document.getElementById('acctList').innerHTML = banks.map(function (b) {
      var isP = d.primary === b.id;
      var v = d.alloc[b.id];
      return '<div class="acct' + (isP ? ' primary' : '') + '">' +
        '<div class="acct-head">' + CM.bankAv(b, true) +
          '<div class="row-main"><div class="row-title" style="font-size:13px">' + CM.esc(b.bank) + '</div>' +
          '<div class="row-sub">' + CM.mask(b.acct) + '</div></div>' +
          (isP ? '<span class="chip ok">Primary</span>' : '') + '</div>' +
        (isP ? '<div class="remainder">Gets the remaining eligible balance</div>'
             : '<div class="field"><input inputmode="decimal" data-acct="' + b.id + '" placeholder="0" value="' +
                 (v ? v : '') + '"><span class="suffix">' + unit + '</span></div>') +
      '</div>';
    }).join('');

    document.querySelectorAll('[data-acct]').forEach(function (inp) {
      inp.addEventListener('input', function () {
        var clean = inp.value.replace(d.type === 'fixed' ? /[^\d.]/g : /[^\d]/g, '');
        if (clean !== inp.value) inp.value = clean;
        var n = parseFloat(clean);
        if (n > 0) d.alloc[inp.dataset.acct] = n; else delete d.alloc[inp.dataset.acct];
        CM.saveDraft(d);
        refresh();
      });
    });
    document.querySelectorAll('[data-primary]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        d.primary = btn.dataset.primary;
        delete d.alloc[d.primary];
        CM.saveDraft(d);
        render();
      });
    });
    refresh();
  }

  /* Everything that changes as the merchant types, without re-rendering the
     inputs (which would steal focus). */
  function refresh() {
    var others = banks.filter(function (b) { return b.id !== d.primary; });
    var total = others.reduce(function (s, b) { return s + (+d.alloc[b.id] || 0); }, 0);

    var meter = '';
    if (d.type === 'percent') {
      var over = total > 100;
      meter = '<div class="meter-row"><span>' + total + '% allocated</span>' +
        '<b style="color:' + (over ? 'var(--red-d)' : 'var(--green-d)') + '">' +
        (over ? (total - 100) + '% over' : (100 - total) + '% to remainder') + '</b></div>' +
        '<div class="meter' + (over ? ' over' : '') + '"><i style="width:' + Math.min(100, total) + '%"></i></div>';
    } else {
      meter = '<div class="field-note">Higher amounts are paid first if the eligible balance runs short. Working balance: <b>' +
        CM.money(CM.WORKING_BALANCE) + ' ETB</b></div>';
    }
    document.getElementById('meterWrap').innerHTML = meter;

    var rows = CM.split(d, CM.WORKING_BALANCE), sum = 0;
    document.getElementById('preview').innerHTML =
      '<div class="hint">Based on your working balance of <b>' + CM.money(CM.WORKING_BALANCE) + ' ETB</b>. The real split uses the eligible balance at sweep time.</div>' +
      rows.map(function (r) {
        sum += r.amount;
        var b = CM.bank(r.id);
        return '<div class="alloc-line">' + CM.bankAv(b, true) +
          '<div class="nm">' + (r.unallocated ? 'Stays in M-PESA' : CM.esc(b.bank)) +
          (r.primary ? '<span class="tag">REMAINDER</span>' : '') +
          '<small>' + (r.unallocated ? 'No remainder account' : r.primary ? 'Everything left over' :
            d.type === 'fixed' ? CM.money(r.value) + ' ETB fixed' : r.value + '% of balance') +
          (r.short ? ' · balance too low for full amount' : '') + '</small></div>' +
          '<div class="amt' + (r.short ? ' short' : '') + '">' + CM.money(r.amount) + '</div></div>';
      }).join('') +
      '<div class="total"><span>Total swept</span><b>' + CM.money(sum) + ' ETB</b></div>';

    var probs = CM.problems(d);
    document.getElementById('problems').innerHTML = probs.map(function (p) {
      return '<div class="notice bad">' + I.alert + '<span>' + p + '</span></div>';
    }).join('');
    document.getElementById('continueBtn').disabled = probs.length > 0;
  }

  document.querySelectorAll('.opt[data-type]').forEach(function (o) {
    o.addEventListener('click', function () {
      if (d.type === o.dataset.type) return;
      d.type = o.dataset.type;
      d.alloc = {};            /* amounts and percentages don't translate */
      CM.saveDraft(d);
      render();
    });
  });

  var inactive = CM.state.banks.filter(function (b) { return b.status !== 'active'; });
  if (inactive.length) {
    document.getElementById('inactiveNote').innerHTML = '<div class="notice warn">' + I.info + '<span>' +
      inactive.map(function (b) { return '<b>' + CM.esc(b.bank) + '</b>'; }).join(', ') +
      (inactive.length === 1 ? ' is' : ' are') + ' not validated yet, so ' + (inactive.length === 1 ? 'it' : 'they') +
      ' can’t receive sweeps. <a href="cm-banks.html" style="color:var(--green-d);font-weight:700">View accounts</a></span></div>';
  }

  document.getElementById('continueBtn').addEventListener('click', function () {
    CM.saveDraft(d);
    location.href = 'cm-schedule.html';
  });

  render();
})();
</script>
</body>
</html>
