<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bank Accounts</title>
<link rel="stylesheet" href="cm.css">
<style>
  /* Long bank names wrap to a second line rather than being cut off. */
  #list .tile-title{font-size:13.5px;line-height:1.25}
  #list .tile-sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .det-head{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:12px}
  .det-head .bank-av{width:52px;height:52px;font-size:14px}
  .det-head h3{font-size:15px;font-weight:800;text-align:center}
  .sheet .kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;font-size:12.5px;border-top:1px solid var(--line)}
  .sheet .kv span{color:var(--muted)}
  .sheet .kv b{font-weight:700;text-align:right}
</style>
</head>
<body>
<div class="phone-scroll">
  <div class="top">
    <button class="icon-btn" onclick="CM.goBack('cm-home.html')" aria-label="Back" id="backBtn"></button>
    <h1>Bank Accounts</h1>
  </div>

  <div class="page-simple" style="padding-bottom:40px">
    <div class="hist" id="list"></div>
  </div>
</div>
<!-- Pinned guide at the bottom of the screen -->
<div class="footer" style="box-shadow:none"><div class="notice" id="onbNote"></div></div>
<div class="gesture-bar"></div>

<div class="sheet-backdrop" onclick="CM.closeSheet()"></div>
<div class="sheet" id="detSheet"><div id="detBody"></div></div>

<script src="cm.js"></script>
<script>
(function () {
  var I = CM.ICON, c = CM.state.config;
  document.getElementById('backBtn').innerHTML = I.back;
  /* Accounts are added, validated and changed by the back office, so the
     merchant only sees the active ones — no requests, no status. */
  document.getElementById('onbNote').innerHTML = I.info +
    '<span>Bank accounts are managed by the <b>M-PESA Onboarding team</b>.</span>';

  function roleOf(b) {
    if (!c) return 'Not in sweep';
    if (c.primary === b.id) return 'Primary / Remainder';
    if (+c.alloc[b.id] > 0) return c.type === 'fixed' ? CM.money(c.alloc[b.id]) + ' ETB fixed' : c.alloc[b.id] + '% of balance';
    return 'Not in sweep';
  }

  var banks = CM.activeBanks();
  document.getElementById('list').innerHTML = banks.length ? banks.map(function (b) {
    return '<a class="tile" href="#" data-id="' + b.id + '">' + CM.bankAv(b) +
      '<div class="tile-main"><div class="tile-title">' + CM.esc(b.bank) + '</div>' +
      '<div class="tile-sub">' + CM.mask(b.acct) + ' • ' + roleOf(b) + '</div></div>' + I.chev + '</a>';
  }).join('') : '<div class="tile"><div class="tile-sub">No bank accounts linked yet.</div></div>';
  document.querySelectorAll('#list .tile[data-id]').forEach(function (el) {
    el.onclick = function (e) { e.preventDefault(); detail(el.dataset.id); };
  });

  function detail(id) {
    var b = CM.bank(id);
    document.getElementById('detBody').innerHTML =
      '<div class="det-head">' + CM.bankAv(b) + '<h3>' + CM.esc(b.bank) + '</h3></div>' +
      '<div class="kv"><span>Account number</span><b>' + CM.mask(b.acct) + '</b></div>' +
      '<div class="kv"><span>Account holder</span><b>' + CM.esc(b.holder) + '</b></div>' +
      '<div class="kv"><span>In cash sweep</span><b>' + roleOf(b) + '</b></div>' +
      '<div style="height:14px"></div><a class="btn btn-ghost" href="cm-allocation.html?edit=1">' + I.sliders + 'Change allocation</a>';
    CM.openSheet('detSheet');
  }

  if (location.hash) { var id = location.hash.slice(1); if (CM.bank(id)) setTimeout(function () { detail(id); }, 150); }
})();
</script>
</body>
</html>
