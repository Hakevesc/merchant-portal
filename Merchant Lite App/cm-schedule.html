<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sweep Schedule</title>
<link rel="stylesheet" href="cm.css">
<style>
  .wheel.wide{width:180px}
  .md-grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
    max-height:236px;overflow-y:auto;scrollbar-width:none;margin-bottom:18px;padding:2px;
  }
  .md-grid::-webkit-scrollbar{display:none}
  .md-grid .day-chip{height:44px;font-size:14px}
  .start-opts{display:flex;gap:8px;margin-bottom:14px}
  .start-opts .day-chip{flex:1}
  #nextNote{margin-top:16px}
</style>
</head>
<body>
<div class="phone-scroll">
  <div class="header">
    <button class="icon-btn" onclick="location.href='cm-home.html'" aria-label="Close" id="backBtn"></button>
    <div class="header-title">SWEEP SCHEDULE</div>
    <div class="step-dots"><i class="on"></i><i></i><i></i></div>
  </div>

  <div class="page">
    <div class="section-label">When and how often</div>

    <div class="field-label" style="margin-top:0">Frequency</div>
    <button class="field" id="freqBtn"><span class="val" id="freqVal"></span><span class="suffix" data-ico="down"></span></button>

    <div id="dayWrap"></div>

    <div class="field-label">Sweep time</div>
    <button class="field" id="timeBtn"><span class="val placeholder" id="timeVal">Choose time</span><span class="suffix" data-ico="clock"></span></button>

    <div class="field-label">Start date</div>
    <button class="field" id="dateBtn"><span class="val" id="dateVal"></span><span class="suffix" data-ico="cal"></span></button>

    <div id="nextNote"></div>
  </div>
</div>

<div class="footer">
  <button class="btn btn-primary" id="continueBtn">Continue</button>
</div>
<div class="gesture-bar"></div>

<!-- Frequency sheet -->
<div class="sheet-backdrop" onclick="CM.closeSheet()"></div>
<div class="sheet" id="freqSheet">
  <div class="sheet-title">Frequency</div>
  <div class="sheet-list" id="freqList"></div>
</div>

<!-- Day sheet (weekly / monthly) -->
<div class="sheet" id="daySheet">
  <div class="sheet-title" id="daySheetTitle">Sweep day</div>
  <div class="wheels" id="dayWheelWrap"><div class="wheel wide" id="wDayPick"></div></div>
  <!-- Monthly: First / Last day shortcuts, then the dates three per row. -->
  <div id="mdPick" style="display:none">
    <div class="start-opts"><button class="day-chip" data-md="1">First day</button><button class="day-chip" data-md="last">Last day</button></div>
    <div class="md-grid" id="mdGrid"></div>
  </div>
  <button class="btn btn-primary" id="daySelect">Select</button>
</div>

<!-- Time sheet -->
<div class="sheet" id="timeSheet">
  <div class="sheet-title">Sweep time</div>
  <div class="wheels"><div class="wheel" id="wHour"></div><div class="wheel" id="wMin"></div><div class="wheel" id="wAp"></div></div>
  <button class="btn btn-primary" id="timeSelect">Select</button>
</div>

<!-- Start date sheet -->
<div class="sheet" id="dateSheet">
  <div class="sheet-title">Start date</div>
  <div class="start-opts">
    <button class="day-chip" data-start="now">Immediately</button>
    <button class="day-chip" data-start="pick">Pick a date</button>
  </div>
  <div class="wheels" id="dateWheels"><div class="wheel" id="wDay"></div><div class="wheel" id="wMon"></div><div class="wheel" id="wYear"></div></div>
  <button class="btn btn-primary" id="dateSelect">Select</button>
</div>

<script src="cm.js"></script>
<script>
(function () {
  var I = CM.ICON;
  /* Step 1 of the set-up flow. Entering with ?edit=1 starts a fresh draft
     from the live configuration (or a blank one the first time). */
  if (/[?&]edit=1/.test(location.search)) { CM.startDraft(); history.replaceState(null, '', 'cm-schedule.html'); }
  var d = CM.getDraft();
  document.getElementById('backBtn').innerHTML = I.close;
  document.querySelectorAll('[data-ico]').forEach(function (el) { el.innerHTML = I[el.dataset.ico]; });

  var FREQS = [
    ['daily', 'Daily', 'clock'],
    ['weekly', 'Weekly', 'cal'],
    ['monthly', 'Monthly', 'cal']
  ];

  function render() {
    document.getElementById('freqVal').textContent = d.freq.toUpperCase();

    /* Weekly and monthly pick their day from a bottom-sheet wheel, the same
       as sweep time and start date. Days 29–31 are left out so a monthly
       sweep runs every month; "Last day" covers month end. */
    var wrap = document.getElementById('dayWrap');
    if (d.freq === 'weekly' || d.freq === 'monthly') {
      var label = d.freq === 'weekly' ? 'Sweep day' : 'Day of the month';
      var val = d.freq === 'weekly' ? CM.WEEKDAYS[d.weekday].toUpperCase()
        : d.monthday === 'last' ? 'LAST DAY' : CM.ordinal(d.monthday).toUpperCase();
      wrap.innerHTML = '<div class="field-label">' + label + '</div>' +
        '<button class="field" id="dayBtn"><span class="val">' + val + '</span><span class="suffix">' + I.cal + '</span></button>';
      document.getElementById('dayBtn').onclick = openDay;
    } else wrap.innerHTML = '';

    var tv = document.getElementById('timeVal');
    tv.textContent = d.time ? CM.time12(d.time) : 'Choose time';
    tv.classList.toggle('placeholder', !d.time);
    document.getElementById('dateVal').textContent = CM.dateLabel(d.start);

    var note = document.getElementById('nextNote');
    if (!d.time) note.innerHTML = '<div class="notice">' + I.info + '<span>Choose a sweep time to see when the first sweep runs.</span></div>';
    else if (d.enabled === false) note.innerHTML = '<div class="notice warn">' + I.pause.replace('<svg', '<svg') + '<span>Automatic sweep is off. Your setup is saved, but nothing is transferred until you turn it on.</span></div>';
    else note.innerHTML = '<div class="notice">' + I.clock + '<span>First sweep: <b>' + CM.runLabel(CM.nextRun(d)) +
      '</b>. The eligible balance is calculated at that moment, then split across your accounts.</span></div>';
    document.getElementById('continueBtn').disabled = !d.time;
  }
  function save() { CM.saveDraft(d); render(); }

  /* ---- Frequency ---- */
  document.getElementById('freqBtn').onclick = function () {
    document.getElementById('freqList').innerHTML = FREQS.map(function (f) {
      return '<button class="opt' + (d.freq === f[0] ? ' on' : '') + '" data-f="' + f[0] + '">' +
        '<span class="opt-ico">' + I[f[2]] + '</span><span><span class="opt-title" style="display:block">' + f[1] +
        '</span></span><span class="radio"></span></button>';
    }).join('');
    document.querySelectorAll('[data-f]').forEach(function (b) {
      b.onclick = function () { d.freq = b.dataset.f; CM.closeSheet(); save(); };
    });
    CM.openSheet('freqSheet');
  };

  /* ---- Day (weekly / monthly) ---- */
  var wDayPick, mdChoice;
  function markMd() {
    document.querySelectorAll('#mdPick [data-md]').forEach(function (b) {
      var v = b.dataset.md === 'last' ? 'last' : +b.dataset.md;
      /* "First day" and the 1 in the grid are the same choice. */
      b.classList.toggle('on', v === mdChoice);
    });
  }
  function openDay() {
    var weekly = d.freq === 'weekly';
    document.getElementById('daySheetTitle').textContent = weekly ? 'Sweep day' : 'Day of the month';
    document.getElementById('dayWheelWrap').style.display = weekly ? '' : 'none';
    document.getElementById('mdPick').style.display = weekly ? 'none' : '';
    CM.openSheet('daySheet');
    if (weekly) {
      var items = [1, 2, 3, 4, 5, 6, 0].map(function (i) { return { label: CM.WEEKDAYS[i], value: i }; });
      wDayPick = CM.wheel(document.getElementById('wDayPick'), items, d.weekday);
    } else {
      mdChoice = d.monthday;
      var g = '';
      for (var i = 1; i <= 28; i++) g += '<button class="day-chip" data-md="' + i + '">' + i + '</button>';
      document.getElementById('mdGrid').innerHTML = g;
      document.querySelectorAll('#mdPick [data-md]').forEach(function (b) {
        b.onclick = function () { mdChoice = b.dataset.md === 'last' ? 'last' : +b.dataset.md; markMd(); };
      });
      markMd();
    }
  }
  document.getElementById('daySelect').onclick = function () {
    if (d.freq === 'weekly') d.weekday = wDayPick.get(); else d.monthday = mdChoice;
    CM.closeSheet(); save();
  };

  /* ---- Time ---- */
  var hours = [], mins = [];
  for (var h = 1; h <= 12; h++) hours.push({ label: String(h).padStart(2, '0'), value: h });
  for (var m = 0; m < 60; m += 5) mins.push({ label: String(m).padStart(2, '0'), value: m });
  var wh, wm, wa;
  document.getElementById('timeBtn').onclick = function () {
    var cur = (d.time || '18:00').split(':'), H = +cur[0];
    CM.openSheet('timeSheet');
    wh = CM.wheel(document.getElementById('wHour'), hours, H % 12 || 12);
    wm = CM.wheel(document.getElementById('wMin'), mins, Math.round(+cur[1] / 5) * 5 % 60);
    wa = CM.wheel(document.getElementById('wAp'), [{ label: 'AM', value: 'AM' }, { label: 'PM', value: 'PM' }], H >= 12 ? 'PM' : 'AM');
  };
  document.getElementById('timeSelect').onclick = function () {
    var H = wh.get() % 12 + (wa.get() === 'PM' ? 12 : 0);
    d.time = String(H).padStart(2, '0') + ':' + String(wm.get()).padStart(2, '0');
    CM.closeSheet(); save();
  };

  /* ---- Start date ---- */
  var wd, wmo, wy, startMode;
  function setStartMode(mode) {
    startMode = mode;
    document.querySelectorAll('[data-start]').forEach(function (b) { b.classList.toggle('on', b.dataset.start === mode); });
    document.getElementById('dateWheels').style.display = mode === 'pick' ? '' : 'none';
    if (mode === 'pick' && !wd) buildDateWheels();
  }
  function buildDateWheels() {
    var now = new Date(), base = d.start && d.start !== 'immediately' ? new Date(d.start + 'T00:00:00')
      : new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
    var days = [], mons = [], years = [];
    for (var i = 1; i <= 31; i++) days.push({ label: String(i).padStart(2, '0'), value: i });
    CM.MONTHS.forEach(function (n, k) { mons.push({ label: n.toUpperCase(), value: k }); });
    for (var y = now.getFullYear(); y <= now.getFullYear() + 1; y++) years.push({ label: String(y), value: y });
    wd = CM.wheel(document.getElementById('wDay'), days, base.getDate());
    wmo = CM.wheel(document.getElementById('wMon'), mons, base.getMonth());
    wy = CM.wheel(document.getElementById('wYear'), years, base.getFullYear());
  }
  document.querySelectorAll('[data-start]').forEach(function (b) { b.onclick = function () { setStartMode(b.dataset.start); }; });
  document.getElementById('dateBtn').onclick = function () {
    CM.openSheet('dateSheet');
    setStartMode(d.start && d.start !== 'immediately' ? 'pick' : 'now');
  };
  document.getElementById('dateSelect').onclick = function () {
    if (startMode === 'now') d.start = 'immediately';
    else {
      var y = wy.get(), mo = wmo.get(), day = Math.min(wd.get(), new Date(y, mo + 1, 0).getDate());
      var picked = new Date(y, mo, day), today = new Date(); today.setHours(0, 0, 0, 0);
      if (picked < today) { CM.toast('Pick today or a later date.'); return; }
      d.start = y + '-' + String(mo + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
    }
    CM.closeSheet(); save();
  };

  document.getElementById('continueBtn').onclick = function () { CM.saveDraft(d); location.href = 'cm-allocation.html'; };

  render();
})();
</script>
</body>
</html>
