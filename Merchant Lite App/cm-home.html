<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cash Management</title>
<link rel="stylesheet" href="cm.css">
<style>
  /* Home-only: balance hide toggle and the wallet drawing. */
  .eye{background:none;border:none;padding:0;cursor:pointer;display:flex}
  .eye svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
  /* With no sweeps yet, the empty history card stretches to the bottom of
     the screen, its message centred inside. */
  .phone-scroll{display:flex;flex-direction:column}
  .phone-scroll > *{flex-shrink:0}
  .home-page{flex:1 0 auto;display:flex;flex-direction:column}
  .home-page > *{flex-shrink:0}
  .home-page.no-history .hist{flex:1 0 auto;display:flex;align-items:center;justify-content:center}
  .tile-setup{flex-wrap:wrap}
  .setup-btn{
    flex-basis:100%;display:flex;align-items:center;justify-content:center;height:46px;margin-top:4px;
    border-radius:14px;background:linear-gradient(135deg,#e8343e 0%,#c41e2a 55%,#a81520 100%);
    color:#fff;font-size:14px;font-weight:700;box-shadow:0 6px 14px rgba(196,30,42,.26);
  }
  .bank-foot{text-decoration:none;color:#fff}
  .bank-foot .logo-stack{margin:0 0 0 auto}
  .bank-foot .logo-stack > span{box-shadow:0 0 0 2.5px #c41e2a}
  .bank-foot .chev{stroke:#fff;width:16px;height:16px;margin-left:4px;stroke-width:2.4}
  .wallet{position:absolute;right:14px;top:16px;width:84px;height:72px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))}
</style>
</head>
<body>
<div class="phone-scroll">
  <div class="top">
    <button class="icon-btn" onclick="CM.goBack('self-service.html')" aria-label="Go back" id="backBtn"></button>
    <h1>Cash Management</h1>
  </div>

  <div class="page home-page" style="padding-bottom:24px">
    <div class="bal">
      <div class="bal-label">Working Account Balance
        <button class="eye" id="eyeBtn" aria-label="Hide balance"></button></div>
      <div class="bal-amt" id="balance"></div>
      <svg class="wallet" viewBox="0 0 84 72" aria-hidden="true">
        <!-- solid wallet: a note tucked behind, white body, clasp -->
        <rect x="14" y="6" width="46" height="26" rx="4" transform="rotate(-8 37 19)" fill="#ffd95e"/>
        <rect x="6" y="18" width="70" height="48" rx="11" fill="#ffffff"/>
        <rect x="6" y="18" width="70" height="12" rx="6" fill="#fde2e4"/>
        <rect x="50" y="35" width="32" height="20" rx="8" fill="#fbd0d4"/>
        <circle cx="60" cy="45" r="4" fill="#c41e2a"/>
      </svg>
      <a class="bal-foot bank-foot" href="cm-banks.html" id="bankRow"></a>
    </div>

    <div class="tiles">
      <a class="tile" id="sweepTile"></a>
    </div>

    <div class="hist-head"><h2>Sweep History</h2><a href="cm-history.html">See all</a></div>
    <div class="hist" id="hist"></div>
  </div>
</div>
<div class="gesture-bar"></div>

<script src="cm.js"></script>
<script>
(function () {
  var I = CM.ICON, S = CM.state, c = S.config;
  var on = !!(c && c.enabled);
  document.getElementById('backBtn').innerHTML = I.back;

  /* ---- Balance, with the same hide toggle as the Loyalty Point card ---- */
  var EYE = '<svg viewBox="0 0 24 24"><path d="M2.5 12S6 5.6 12 5.6 21.5 12 21.5 12 18 18.4 12 18.4 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.9"/></svg>';
  var EYE_OFF = '<svg viewBox="0 0 24 24"><path d="M2.5 12S6 5.6 12 5.6 21.5 12 21.5 12 18 18.4 12 18.4 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.9"/><path d="M3.4 3.4l17.2 17.2"/></svg>';
  var hidden = false;
  try { hidden = localStorage.getItem('mlHideBalances') === '1'; } catch (e) {}
  function paintBalance() {
    document.getElementById('balance').innerHTML = hidden ? '••••••<span class="cur">ETB</span>' : CM.money(CM.WORKING_BALANCE) + '<span class="cur">ETB</span>';
    var eb = document.getElementById('eyeBtn');
    eb.innerHTML = hidden ? EYE_OFF : EYE;
    eb.setAttribute('aria-label', hidden ? 'Show balance' : 'Hide balance');
  }
  document.getElementById('eyeBtn').onclick = function () {
    hidden = !hidden;
    try { localStorage.setItem('mlHideBalances', hidden ? '1' : '0'); } catch (e) {}
    paintBalance();
  };
  paintBalance();

  /* ---- Cash Sweep tile ---- */
  var st = document.getElementById('sweepTile');
  /* Set up: open the sweep (status, edit, pause). Not set up: start the flow. */
  st.href = c ? 'cm-setup.html' : 'cm-schedule.html?edit=1';
  if (!c) {
    /* First time: what the service does, and a clear call to set it up. */
    st.classList.add('tile-setup');
    st.innerHTML = '<span class="tile-ico">' + I.bolt + '</span>' +
      '<div class="tile-main"><div class="tile-title">Cash Sweep</div>' +
        '<div class="tile-sub">Automatically move funds based on your rules.</div></div>' + I.chev +
      '<span class="setup-btn">Set Up Cash Sweep</span>';
  } else {
    st.innerHTML = '<span class="tile-ico' + (on ? '' : ' idle') + '">' + I.bolt + '</span>' +
      '<div class="tile-main"><div class="tile-title">Cash Sweep</div>' +
        (on ? '<div class="tile-sub">Next sweep: <b style="color:var(--ink)">' + CM.runLabel(CM.nextRun(c)) + '</b></div>'
            : '<div class="tile-sub">Paused</div>') +
      '</div>' + CM.pill(on ? 'active' : 'paused') + I.chev;
  }

  /* ---- Bank accounts, on the foot of the red card ---- */
  var active = CM.activeBanks();
  document.getElementById('bankRow').innerHTML = I.bank +
    '<div><div class="k">Bank Accounts</div><div class="v">' + active.length + ' Linked Account' + (active.length === 1 ? '' : 's') + '</div></div>' +
    /* Overlapping logos, up to four; past that the fourth becomes +N. */
    '<div class="logo-stack">' + (function () {
      var show = active.length > 4 ? active.slice(0, 3) : active;
      return show.map(function (b) {
        return '<span title="' + CM.esc(b.bank) + '">' + CM.bankAv(b, true) + '</span>';
      }).join('') + (active.length > 4 ? '<span class="more">+' + (active.length - 3) + '</span>' : '');
    })() + '</div>' + I.chev;

  /* ---- Five latest sweeps ---- */
  document.getElementById('hist').innerHTML = S.history.slice(0, 5).map(function (b) {
    return '<a class="tile" href="cm-sweep.html?ref=' + b.ref + '">' + CM.sweepRow(b) + '</a>';
  }).join('') || CM.emptySweeps();
  document.querySelector('.home-page').classList.toggle('no-history', !S.history.length);
})();
</script>
</body>
</html>
