<!DOCTYPE html>
<html lang="en" data-no-demo>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Distribute Float</title>
<link rel="stylesheet" href="cm.css">
<style>
  .field-label{margin-top:18px}
  .field input::placeholder{color:var(--faint);font-weight:500}
  /* A set number reads as text with a pencil; the pencil makes it editable. */
  .field input[readonly]{cursor:default}
  .field .edit-in{
    flex-shrink:0;padding:0 14px;border:none;border-left:1px solid var(--field-line);background:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:6px;
    font-family:inherit;font-size:12.5px;font-weight:700;color:var(--green-d);
  }
  .field .edit-in svg{width:15px;height:15px;stroke:var(--green-d);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .field.editing{background:#fff;border-color:var(--green)}
  .field.editing .edit-in{display:none}
  /* The business behind a number, shown once it's recognised. */
  .acct-card{
    margin-top:12px;padding:14px 16px;border-radius:14px;background:#f3f6fb;
    box-shadow:0 6px 16px rgba(30,64,120,.12);
  }
  .acct-card b{display:block;font-size:14px;font-weight:700;letter-spacing:.3px;margin-bottom:8px}
  .acct-card div{display:flex;justify-content:space-between;gap:10px;font-size:10.5px}
  .acct-card span{font-weight:700;letter-spacing:.3px}
  .acct-card em{font-style:normal;color:var(--muted)}
  /* Swap sender and receiver, so float can go either way. */
  .swap-row{display:flex;justify-content:center;margin:14px 0 -6px}
  .swap-btn{
    width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;
    display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.08);transition:transform .25s;
  }
  .swap-btn.turn{transform:rotate(180deg)}
  .swap-btn svg{width:16px;height:16px;stroke:var(--ink-2);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<div class="phone-scroll">
  <div class="header">
    <button class="icon-btn" onclick="location.href='self-service.html'" aria-label="Close" id="closeBtn"></button>
    <div class="header-title">DISTRIBUTE FLOAT</div>
  </div>
  <div class="page">
    <div class="field-label" style="margin-top:4px">Sender business number</div>
    <div class="field" id="senderField">
      <input id="sender" inputmode="numeric" autocomplete="off" placeholder="Enter Sender Business Number">
      <button type="button" class="edit-in" data-edit="sender" aria-label="Edit sender business number"></button>
    </div>
    <div id="senderInfo"></div>

    <div class="swap-row"><button type="button" class="swap-btn" id="swapBtn" aria-label="Swap sender and receiver"><svg viewBox="0 0 24 24"><path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"/></svg></button></div>

    <div class="field-label">Business number</div>
    <div class="field" id="receiverField">
      <input id="receiver" inputmode="numeric" autocomplete="off" placeholder="Enter Float Business Number">
      <button type="button" class="edit-in" data-edit="receiver" aria-label="Edit business number"></button>
    </div>
    <div id="receiverInfo"></div>

    <div class="field-label">Amount</div>
    <div class="field" id="amountField"><input id="amount" inputmode="decimal" autocomplete="off" placeholder="Enter Amount"><span class="suffix">ETB</span></div>
    <div id="amountInfo"></div>

    <div class="field-label">Description</div>
    <div class="field"><input id="description" autocomplete="off" maxlength="60" placeholder="Enter description"></div>
  </div>
</div>

<div class="footer" style="box-shadow:none">
  <button class="btn btn-primary" id="confirmBtn" disabled>Confirm</button>
</div>
<div class="gesture-bar"></div>

<script src="cm.js"></script>
<script src="df.js"></script>
<script>
(function () {
  var I = CM.ICON, d = DF.getDraft();
  document.getElementById('closeBtn').innerHTML = I.close;
  var $ = function (id) { return document.getElementById(id); };
  document.querySelectorAll('.edit-in').forEach(function (b) { b.innerHTML = I.edit + 'Edit'; });

  /* The sender starts as the merchant's own business. */
  if (!d.sender) d.sender = DF.HOME;
  $('sender').value = DF.spaced(d.sender);
  $('receiver').value = d.receiver || '';
  $('amount').value = d.amount || '';
  $('description').value = d.description || '';

  function card(acct) {
    return '<div class="acct-card"><b>' + CM.esc(acct.name) + '</b><div><span>WORKING ACCOUNT BALANCE</span><em>' + CM.money(acct.balance) + ' ETB</em></div></div>';
  }
  function note(msg) { return '<div class="field-note error">' + msg + '</div>'; }

  /* A recognised number locks as text; an empty or unknown one stays open. */
  function setEditing(which, on) {
    $(which).readOnly = !on;
    $(which + 'Field').classList.toggle('editing', on);
    if (on) { $(which).focus(); var v = $(which).value; $(which).setSelectionRange(v.length, v.length); }
  }
  function settle(which) {
    var known = !!DF.lookup($(which).value);
    $(which).readOnly = known;
    $(which + 'Field').classList.toggle('editing', !known);
  }

  /* Show the business behind each number as soon as it's complete, and
     only name a problem once the merchant has typed enough to judge it. */
  function render() {
    d.sender = DF.digits($('sender').value);
    d.receiver = DF.digits($('receiver').value);
    d.amount = $('amount').value;
    d.description = $('description').value.trim();
    DF.saveDraft(d);
    var p = DF.problems(d), s = DF.lookup(d.sender), r = DF.lookup(d.receiver);
    var showS = d.sender.length >= 9 && p.sender && p.sender !== 'required';
    var showR = d.receiver.length >= 9 && p.receiver && p.receiver !== 'required';
    var showA = d.amount && p.amount && p.amount !== 'required';
    $('senderInfo').innerHTML = s ? card(s) : showS ? note(p.sender) : '';
    $('receiverInfo').innerHTML = showR ? note(p.receiver) : r ? card(r) : '';
    $('amountInfo').innerHTML = showA ? note(p.amount) : '';
    $('senderField').classList.toggle('error', !!showS);
    $('receiverField').classList.toggle('error', !!showR);
    $('amountField').classList.toggle('error', !!showA);
    $('confirmBtn').disabled = Object.keys(p).length > 0;
  }

  ['sender', 'receiver'].forEach(function (which) {
    $(which).addEventListener('input', function () {
      var v = DF.digits(this.value).slice(0, 9);
      this.value = which === 'sender' ? DF.spaced(v) : v;
      render();
    });
    $(which).addEventListener('blur', function () { settle(which); });
    $(which).addEventListener('keydown', function (e) { if (e.key === 'Enter') this.blur(); });
  });
  document.querySelectorAll('[data-edit]').forEach(function (b) {
    b.onclick = function () { setEditing(b.dataset.edit, true); };
  });
  $('swapBtn').onclick = function () {
    var s = d.sender, r = d.receiver;
    $('sender').value = DF.spaced(r); $('receiver').value = s;
    this.classList.toggle('turn');
    render(); settle('sender'); settle('receiver');
  };
  $('amount').addEventListener('input', function () {
    var v = this.value.replace(/[^\d.]/g, '').replace(/\.(?=.*\.)/g, '').replace(/(\.\d{2})\d+$/, '$1');
    if (v !== this.value) this.value = v;
    render();
  });
  $('description').addEventListener('input', render);
  $('confirmBtn').onclick = function () { location.href = 'df-confirm.html'; };

  render();
  settle('sender'); settle('receiver');

  /* Coming back from the confirm screen to change one value. */
  var focus = new URLSearchParams(location.search).get('focus');
  if (focus === 'sender' || focus === 'receiver') setTimeout(function () { setEditing(focus, true); }, 150);
  else if (focus && $(focus)) setTimeout(function () { $(focus).focus(); }, 150);
})();
</script>
</body>
</html>
