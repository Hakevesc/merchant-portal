<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Care Desk Lookup — Merchant Loyalty</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="portal.css" />
  <link rel="stylesheet" href="loyalty.css" />
  <style>
    .cd-search-card { margin-bottom: 26px; }
    .cd-search-head { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
    .cd-search-head .icon-wrap-green { margin: 0; width: 48px; height: 48px; border-radius: 14px; }
    .cd-search-head .card-title { font-size: 1.15rem; margin-bottom: 2px; }
    .cd-search-head .card-subtitle { font-size: 0.83rem; }
    .cd-section-title {
      font-size: 0.78rem; font-weight: 800; color: #475569;
      text-transform: uppercase; letter-spacing: 0.8px; margin: 0 0 12px 2px;
    }

    /* ── Floating demo-scenario helper ── */
    .cd-fab-wrap { position: fixed; right: 24px; bottom: 24px; z-index: 9000; }
    .cd-fab {
      width: 52px; height: 52px; border-radius: 50%; border: none; cursor: pointer;
      background: linear-gradient(135deg, #2FC56D 0%, #239150 100%); color: #fff;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 22px rgba(35,145,80,0.38); transition: all 0.22s ease;
    }
    .cd-fab:hover { transform: translateY(-2px) scale(1.04); box-shadow: 0 12px 28px rgba(35,145,80,0.46); }
    .cd-fab [data-lucide] { width: 24px; height: 24px; stroke-width: 2.4; }
    .cd-fab-wrap.open .cd-fab { background: linear-gradient(135deg, #64748b 0%, #475569 100%); box-shadow: 0 8px 22px rgba(71,85,105,0.34); }

    .cd-fab-panel {
      position: absolute; right: 0; bottom: 66px; width: 322px;
      background: #fff; border: 1px solid #e2e8f0; border-radius: 18px;
      box-shadow: 0 18px 44px rgba(15,23,42,0.18);
      overflow: hidden; transform-origin: bottom right;
      opacity: 0; transform: translateY(10px) scale(0.96); pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s cubic-bezier(0.175,0.885,0.32,1.1);
    }
    .cd-fab-wrap.open .cd-fab-panel { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
    .cd-fab-head {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 15px 16px 13px; border-bottom: 1px solid #edf2f7; background: #f8fafc;
    }
    .cd-fab-title { font-size: 0.87rem; font-weight: 800; color: #0f172a; }
    .cd-fab-sub { font-size: 0.73rem; font-weight: 600; color: #64748b; margin-top: 2px; }
    .cd-fab-close {
      background: none; border: none; color: #94a3b8; cursor: pointer;
      margin-left: auto; display: flex; padding: 2px;
    }
    .cd-fab-close:hover { color: #475569; }
    .cd-fab-close [data-lucide] { width: 16px; height: 16px; }
    .cd-fab-list { max-height: 44vh; overflow-y: auto; padding: 7px; }
    .cd-fab-item {
      display: flex; align-items: center; gap: 11px; width: 100%;
      background: none; border: none; border-radius: 11px; padding: 9px 10px;
      font-family: 'Barlow', sans-serif; cursor: pointer; text-align: left;
      transition: background 0.15s;
    }
    .cd-fab-item:hover { background: #f1f5f9; }
    .cd-fab-code {
      font-family: monospace; font-size: 0.82rem; font-weight: 800; color: #1b7341;
      background: #eaf5ee; border: 1px solid #b7ddc5; border-radius: 8px;
      padding: 4px 9px; flex-shrink: 0;
    }
    .cd-fab-item.is-error .cd-fab-code { color: #991b1b; background: #fef2f2; border-color: #fecdd3; }
    .cd-fab-lbl { font-size: 0.81rem; font-weight: 600; color: #334155; }

    /* Keep toasts clear of the floating button */
    .toast-container { bottom: 92px; }

    @media (max-width: 520px) {
      .cd-fab-wrap { right: 16px; bottom: 16px; }
      .cd-fab-panel { width: calc(100vw - 32px); }
      .toast-container { bottom: 84px; }
    }
  </style>
</head>
<body class="portal-body">

  <!-- Topbar -->
  <div class="portal-topbar">
    <div class="brand" style="display:flex;align-items:center;gap:16px;position:relative;z-index:1;">
      <div class="logo-wrapper" style="display:flex;align-items:center;justify-content:center;background:#fff;border-radius:14px;padding:9px 18px;box-shadow:0 4px 14px rgba(0,0,0,0.16);">
        <img src="M-Pesa-Logo.png" alt="M-PESA" style="height:30px;object-fit:contain;display:block;" />
      </div>
      <span class="brand-title" style="font-family:'Barlow',sans-serif;font-weight:800;font-size:1.05rem;letter-spacing:.6px;text-transform:uppercase;color:#fff;padding-left:16px;border-left:2px solid rgba(255,255,255,0.28);line-height:1.15;">Merchant Loyalty</span>
    </div>
    <div class="topbar-right" id="topbarRight" style="position:relative;z-index:1;">
      <a href="#" class="logout-btn" onclick="LP.logout();return false;"><i data-lucide="log-out" style="width:16px;height:16px;stroke-width:2.5;"></i> Logout</a>
    </div>
  </div>

  <!-- Breadcrumb -->
  <div class="portal-nav">
    <a href="home.html"><i data-lucide="home" style="width:16px;height:16px;vertical-align:middle;margin-right:4px;"></i> Home</a>
    &nbsp;›&nbsp;
    <span>Merchant Loyalty</span>
    &nbsp;›&nbsp;
    <span class="crumb-active" id="breadcrumbActive">Care Desk Lookup</span>
  </div>

  <div class="portal-wrap">

    <!-- Search -->
    <div class="el-card cd-search-card" id="cdSearchCard">
      <div class="cd-search-head">
        <div class="icon-wrap-green"><i data-lucide="search-code"></i></div>
        <div>
          <h2 class="card-title">Merchant Loyalty Lookup</h2>
          <p class="card-subtitle">Search a Merchant Short Code to view campaign, points, redemption and claim information.</p>
        </div>
      </div>

      <form class="lp-search-form" id="cdForm" onsubmit="handleLookup(event)" novalidate>
        <div class="input-wrapper">
          <span class="input-icon"><i data-lucide="hash"></i></span>
          <input type="text" id="cdShortCode" class="form-input" placeholder="Enter Merchant Short Code, e.g. 10070" autocomplete="off" />
        </div>
        <button type="submit" class="btn-check auto-w"><i data-lucide="search"></i> Search</button>
      </form>

    </div>

    <!-- Result -->
    <div id="cdResult"></div>

  </div>

  <!-- Floating demo-scenario helper -->
  <div class="cd-fab-wrap" id="cdFabWrap" style="display:none;">
    <div class="cd-fab-panel" id="cdFabPanel" role="dialog" aria-label="Demo short codes">
      <div class="cd-fab-head">
        <div>
          <div class="cd-fab-title">Demo Short Codes</div>
          <div class="cd-fab-sub">Click a code to run that scenario</div>
        </div>
        <button class="cd-fab-close" onclick="toggleDemoCodes(false)" aria-label="Close"><i data-lucide="x"></i></button>
      </div>
      <div class="cd-fab-list" id="cdFabList"></div>
    </div>
    <button class="cd-fab" id="cdFab" onclick="event.stopPropagation(); toggleDemoCodes();" aria-label="Demo short codes" title="Demo short codes">
      <i data-lucide="info" id="cdFabIcon"></i>
    </button>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="loyalty-data.js"></script>
  <script>
    /* ── Access control ─────────────────────────────── */
    var ROLE = LP.requireLogin();
    var AUTHORIZED = LP.can(['care-desk', 'admin']);

    function renderUnauthorized() {
      document.getElementById('cdSearchCard').style.display = 'none';
      document.getElementById('cdResult').innerHTML =
        '<div class="el-card"><div class="result-empty is-error">' +
          '<i data-lucide="shield-off"></i>' +
          '<h3>Access Denied</h3>' +
          '<p>You are not authorized to access Merchant Loyalty information.</p>' +
        '</div></div>';
      LP.icons();
    }

    /* ── Empty / error states ───────────────────────── */
    function stateCard(icon, title, message, isError) {
      return '<div class="el-card"><div class="result-empty' + (isError ? ' is-error' : '') + '">' +
        '<i data-lucide="' + icon + '"></i>' +
        '<h3>' + LP.esc(title) + '</h3>' +
        '<p>' + LP.esc(message) + '</p>' +
      '</div></div>';
    }

    /* ── Lookup ─────────────────────────────────────── */
    function handleLookup(e) {
      e.preventDefault();
      var code = document.getElementById('cdShortCode').value.trim();
      var out = document.getElementById('cdResult');

      /* FR-02 — validate before searching */
      if (!code || !/^\d+$/.test(code)) {
        LP.toast('Invalid Short Code', 'Please enter a valid Merchant Short Code.', 'error');
        out.innerHTML = '';
        return;
      }

      /* Simulated backend failure */
      if (code === LP.FAILURE_CODE) {
        out.innerHTML = stateCard('server-crash', 'Service Unavailable',
          'Unable to retrieve Merchant Loyalty information at this time. Please try again later.', true);
        LP.audit('Merchant loyalty search', code, 'Service failure');
        LP.icons();
        return;
      }

      var m = LP.merchant(code);

      /* Merchant not found */
      if (!m) {
        out.innerHTML = stateCard('user-x', 'Merchant Not Found',
          'No merchant was found for the entered Short Code.', false);
        LP.audit('Merchant loyalty search', code, 'Not found');
        LP.icons();
        return;
      }

      /* Merchant exists but carries no loyalty record */
      if (!m.loyalty) {
        out.innerHTML = renderIdentity(code, m) +
          stateCard('info', 'No Loyalty Information',
            'No Merchant Loyalty information is available for this merchant.', false) +
          auditNote();
        LP.audit('Merchant loyalty search', code, 'No loyalty record');
        LP.icons();
        return;
      }

      out.innerHTML =
        renderIdentity(code, m) +
        renderBlacklist(m) +
        renderPoints(LP.pointsFor(code)) +
        renderCampaign(m) +
        renderRedemptions(LP.redemptionsFor(code)) +
        auditNote();

      LP.audit('Merchant loyalty search', code, 'Success');
      LP.icons();
    }

    /* ── 1. Identity strip ──────────────────────────── */
    function renderIdentity(code, m) {
      var tone = m.blacklisted ? 'tone-red' : 'tone-green';
      var icon = m.blacklisted ? 'shield-alert' : 'store';
      var statusChip = (m.status === 'Active')
        ? '<span class="lp-chip lp-chip-active"><i data-lucide="check"></i> Active</span>'
        : '<span class="lp-chip lp-chip-inactive"><i data-lucide="minus"></i> Inactive</span>';
      var blChip = m.blacklisted
        ? ' <span class="lp-chip lp-chip-blacklist"><i data-lucide="ban"></i> Blacklisted</span>'
        : '';

      return '<div class="lp-detail-card ' + tone + '">' +
        '<div class="lp-detail-header">' +
          '<i data-lucide="' + icon + '"></i>' +
          '<div class="lp-detail-header-text">' +
            '<div class="lp-detail-title">' + LP.esc(m.name) + '</div>' +
            '<div class="lp-detail-subtitle">Short Code ' + LP.esc(code) + ' · ' + LP.esc(m.category) + '</div>' +
          '</div>' +
          '<div style="display:flex;gap:8px;flex-wrap:wrap;">' + statusChip + blChip + '</div>' +
        '</div>' +
        '<div class="lp-detail-body">' +
          item('Merchant Name', m.name) +
          item('Merchant Short Code', code) +
          item('Merchant Category', m.category) +
          item('Merchant Status', m.status) +
          item('Region', m.region) +
          item('Cluster', m.cluster) +
        '</div>' +
      '</div>';
    }

    function item(label, value) {
      return '<div class="lp-detail-item">' +
        '<div class="lp-detail-lbl">' + LP.esc(label) + '</div>' +
        '<div class="lp-detail-val">' + LP.esc(LP.dash(value)) + '</div>' +
      '</div>';
    }

    /* ── 2. Blacklist banner ────────────────────────── */
    function renderBlacklist(m) {
      if (!m.blacklisted || !m.blacklist) return '';
      var b = m.blacklist;
      return '<div class="el-card" style="margin-bottom:24px;">' +
        '<div class="res-status-banner ineligible">' +
          '<i data-lucide="ban"></i>' +
          '<div>' +
            '<div class="res-status-title">Merchant Is Blacklisted</div>' +
            '<div class="res-status-sub">This merchant is blocked from loyalty campaigns and redemptions.</div>' +
          '</div>' +
        '</div>' +
        '<div class="res-grid">' +
          resItem('Blacklist Status', 'Active', 'neg') +
          resItem('Blacklist Reason', b.reason) +
          resItem('Date Added to Blacklist', b.dateAdded) +
          resItem('Blacklist Validity', b.validity) +
        '</div>' +
      '</div>';
    }

    function resItem(label, value, tone) {
      return '<div class="res-item">' +
        '<div class="res-item-lbl">' + LP.esc(label) + '</div>' +
        '<div class="res-item-val' + (tone ? ' ' + tone : '') + '">' + LP.esc(LP.dash(value)) + '</div>' +
      '</div>';
    }

    /* ── 3. Points ──────────────────────────────────── */
    function renderPoints(p) {
      return '<div class="cd-section-title">Loyalty Points</div>' +
        '<div class="lp-kpi-row">' +
          kpi('Points Earned / Assigned', p.earned, 'trending-up', '') +
          kpi('Points Available', p.available, 'wallet', 'tone-green') +
          kpi('Points Redeemed', p.redeemed, 'gift', '') +
          kpi('Remaining Points', p.available, 'sigma', '') +
        '</div>';
    }

    function kpi(label, value, icon, tone) {
      return '<div class="lp-kpi ' + tone + '">' +
        '<div class="lp-kpi-icon"><i data-lucide="' + icon + '"></i></div>' +
        '<div class="lp-kpi-val">' + LP.points(value) + '</div>' +
        '<div class="lp-kpi-lbl">' + LP.esc(label) + '</div>' +
      '</div>';
    }

    /* ── 4. Campaign ────────────────────────────────── */
    function renderCampaign(m) {
      var l = m.loyalty;
      var participating = l.participating;
      var banner = participating
        ? '<div class="res-status-banner eligible">' +
            '<i data-lucide="check-circle-2"></i>' +
            '<div><div class="res-status-title">Participating in Campaign</div>' +
            '<div class="res-status-sub">Verified against the Merchant Loyalty service</div></div>' +
          '</div>'
        : '<div class="res-status-banner neutral">' +
            '<i data-lucide="minus-circle"></i>' +
            '<div><div class="res-status-title">Not Participating</div>' +
            '<div class="res-status-sub">This merchant does not participate in the campaign</div></div>' +
          '</div>';

      return '<div class="el-card" style="margin-bottom:24px;">' +
        '<div class="lp-card-bar"><div>' +
          '<h3 class="card-title">Campaign</h3>' +
          '<p class="card-subtitle">Eligibility and participation for the active loyalty campaign.</p>' +
        '</div></div>' +
        banner +
        '<div class="res-grid">' +
          resItem('Campaign Name', l.campaign) +
          resItem('Campaign Eligibility Status', l.eligible ? 'Eligible' : 'Not Eligible', l.eligible ? 'pos' : 'neg') +
          resItem('Campaign Participation Status', participating ? 'Participating' : 'Not Participating', participating ? 'pos' : '') +
          resItem('Merchant Category', m.category) +
        '</div>' +
      '</div>';
    }

    /* ── 5. Redemptions & claims ────────────────────── */
    function renderRedemptions(rows) {
      rows = rows || [];
      var body = '';

      if (rows.length === 0) {
        body = '<div class="empty-state">' +
          '<i data-lucide="gift" class="empty-icon"></i>' +
          '<h3>Not Redeemed</h3>' +
          '<p>This merchant has not redeemed any loyalty points.</p>' +
        '</div>';
      } else {
        var CLAIM_TONE = {
          'Claimed':          ['lp-chip-fulfilled', 'check'],
          'Pending Handover': ['lp-chip-pending',   'clock'],
          'Not Allocated':    ['lp-chip-available', 'package'],
          'Exception':        ['lp-chip-exception', 'alert-triangle'],
          'Cancelled':        ['lp-chip-cancelled', 'x']
        };

        var trs = rows.map(function (r) {
          var tone = CLAIM_TONE[r.claimStatus] || ['lp-chip-available', 'circle'];
          var claimTone = tone[0], claimIcon = tone[1];
          return '<tr class="fade-in-row">' +
            '<td><strong>' + LP.esc(r.ref) + '</strong></td>' +
            '<td>' + LP.esc(r.date) + '</td>' +
            '<td>' + LP.points(r.points) + '</td>' +
            '<td>' + LP.esc(r.item) + '</td>' +
            '<td><span class="lp-chip lp-chip-fulfilled"><i data-lucide="check"></i> ' + LP.esc(r.status) + '</span></td>' +
            '<td><span class="lp-chip ' + claimTone + '"><i data-lucide="' + claimIcon + '"></i> ' + LP.esc(r.claimStatus) + '</span></td>' +
            '<td>' + LP.esc(LP.dash(r.claimDate)) + '</td>' +
          '</tr>';
        }).join('');

        body = '<div class="table-responsive"><table class="premium-table">' +
          '<thead><tr>' +
            '<th>Redemption Ref</th><th>Redemption Date</th><th>Redeemed Points</th>' +
            '<th>Prize / Item</th><th>Redemption Status</th><th>Claim Status</th><th>Claim Date</th>' +
          '</tr></thead><tbody>' + trs + '</tbody></table></div>';
      }

      return '<div class="el-card">' +
        '<div class="lp-card-bar">' +
          '<div>' +
            '<h3 class="card-title">Redemptions &amp; Prize Claims</h3>' +
            '<p class="card-subtitle">Points redeemed by this merchant and the status of each prize claim.</p>' +
          '</div>' +
          '<span class="records-badge">' + rows.length + (rows.length === 1 ? ' record' : ' records') + '</span>' +
        '</div>' + body +
      '</div>';
    }

    /* ── Demo scenario helper ───────────────────────── */
    var DEMO_CODES = [
      { code: '10070', label: 'Redeemed & claimed' },
      { code: '10072', label: 'Claims in progress' },
      { code: '10076', label: 'Handover pending' },
      { code: '10077', label: 'Not redeemed' },
      { code: '10073', label: 'Not participating' },
      { code: '10075', label: 'Blacklisted', error: true },
      { code: '10074', label: 'No loyalty record', error: true },
      { code: '99999', label: 'Merchant not found', error: true },
      { code: '10099', label: 'Service failure', error: true }
    ];

    function buildDemoCodes() {
      document.getElementById('cdFabList').innerHTML = DEMO_CODES.map(function (d) {
        return '<button class="cd-fab-item' + (d.error ? ' is-error' : '') + '" onclick="useDemoCode(\'' + d.code + '\')">' +
          '<span class="cd-fab-code">' + LP.esc(d.code) + '</span>' +
          '<span class="cd-fab-lbl">' + LP.esc(d.label) + '</span>' +
        '</button>';
      }).join('');
      document.getElementById('cdFabWrap').style.display = 'block';
      LP.icons();
    }

    function toggleDemoCodes(force) {
      var wrap = document.getElementById('cdFabWrap');
      var open = (force === undefined) ? !wrap.classList.contains('open') : force;
      wrap.classList.toggle('open', open);
      document.getElementById('cdFabIcon').setAttribute('data-lucide', open ? 'x' : 'info');
      LP.icons();
    }

    /* Fill the search field with the chosen code and run the lookup. */
    function useDemoCode(code) {
      var box = document.getElementById('cdShortCode');
      box.value = code;
      toggleDemoCodes(false);
      box.focus();
      handleLookup(new Event('submit'));
    }

    /* ── 6. Audit footnote ──────────────────────────── */
    function auditNote() {
      return '<div class="lp-audit-note">' +
        '<i data-lucide="shield-check"></i> Search logged · ' +
        LP.esc(LP.currentUser()) + ' · ' + LP.esc(LP.stamp()) +
      '</div>';
    }

    /* ── Init ───────────────────────────────────────── */
    (function init() {
      if (!ROLE) return;
      LP.mountRoleChip('topbarRight');

      if (!AUTHORIZED) { renderUnauthorized(); return; }

      document.getElementById('cdResult').innerHTML =
        stateCard('search', 'No Search Run Yet',
          'Enter a Merchant Short Code above to retrieve loyalty, blacklist, redemption and claim information.', false);

      /* Agents search from the keyboard, so Enter must always run the lookup. */
      var box = document.getElementById('cdShortCode');
      box.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter') { ev.preventDefault(); handleLookup(ev); }
      });

      box.focus();

      buildDemoCodes();

      /* Close the helper on outside click or Escape */
      document.addEventListener('click', function (ev) {
        if (!ev.target.closest('#cdFabWrap')) toggleDemoCodes(false);
      });
      document.addEventListener('keydown', function (ev) {
        if (ev.key === 'Escape') toggleDemoCodes(false);
      });

      LP.icons();
    })();
  </script>
  <noscript>Enable JavaScript to view the Merchant Loyalty Care Desk.</noscript>
  <script src="sidebar.js"></script>
</body>
</html>
